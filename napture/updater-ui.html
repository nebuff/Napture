<!DOCTYPE html>
<html lang="en" data-nb-surface="chrome">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Napture updating</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/design-system.css">
  <style>
    /* The updater is a small solid window, not a translucent chrome layer. */
    :root {
      --nb-bg-app: #0F0F14;
      --nb-bg-card: rgba(18, 19, 26, 0.85);
    }
    body {
      background-color: var(--nb-bg-app);
      color: var(--nb-text-primary);
      font-family: var(--nb-font-display);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      border: 1px solid var(--nb-border);
      border-radius: var(--nb-radius-xl);
      -webkit-app-region: drag;
    }
    .updater-card {
      width: 86%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: var(--nb-bg-card);
      border: 1px solid var(--nb-border);
      border-radius: var(--nb-radius-3xl);
      padding: 28px 24px;
      box-shadow: var(--nb-shadow-lg);
      backdrop-filter: var(--nb-blur-sm);
      -webkit-app-region: no-drag;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: var(--nb-space-5);
      margin-bottom: var(--nb-space-8);
    }
    .brand-logo {
      width: 44px;
      height: 44px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px var(--nb-accent-glow));
      animation: pulse 2.4s infinite ease-in-out;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .brand-title {
      font-size: var(--nb-text-xl);
      font-weight: var(--nb-weight-bold);
      color: var(--nb-text-primary);
      letter-spacing: var(--nb-tracking-tight);
      line-height: var(--nb-leading-tight);
    }
    .brand-author {
      font-size: var(--nb-text-xs);
      font-weight: var(--nb-weight-medium);
      color: var(--nb-text-muted);
    }
    .status-title {
      font-size: var(--nb-text-md);
      font-weight: var(--nb-weight-semibold);
      color: var(--nb-text-primary);
      margin-bottom: var(--nb-space-3);
    }
    .status-subtitle {
      font-size: var(--nb-text-sm);
      color: var(--nb-text-secondary);
      margin-bottom: var(--nb-space-8);
      min-height: 18px;
    }
    .progress-track {
      width: 100%;
      height: 8px;
      background: var(--nb-bg-input);
      border: 1px solid var(--nb-border);
      border-radius: var(--nb-radius-xs);
      overflow: hidden;
      margin-bottom: var(--nb-space-6);
      position: relative;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(
        90deg,
        var(--nb-accent-hover) 0%,
        var(--nb-accent) 50%,
        var(--nb-indigo-300) 100%
      );
      box-shadow: 0 0 12px var(--nb-accent-glow);
      border-radius: var(--nb-radius-xs);
      transition: width var(--nb-duration-moderate) var(--nb-ease-standard);
    }
    .progress-fill.indeterminate {
      width: 40% !important;
      position: absolute;
      animation: indeterminate 1.5s infinite ease-in-out;
    }
    .metrics-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      font-size: var(--nb-text-xs);
      color: var(--nb-text-secondary);
      font-weight: var(--nb-weight-medium);
    }
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 4px 12px var(--nb-accent-glow));
      }
      50% {
        transform: scale(1.05);
        filter: drop-shadow(0 6px 20px rgba(127, 140, 255, 0.55));
      }
    }
    @keyframes indeterminate {
      0% { left: -40%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div class="updater-card">
    <div class="brand-group">
      {{LOGO_PLACEHOLDER}}
      <div class="brand-text">
        <span class="brand-title">Napture</span>
        <span class="brand-author">| By nebuff</span>
      </div>
    </div>

    <div class="status-title" id="status-title">Napture updating</div>
    <div class="status-subtitle" id="status-subtitle">Downloading update package...</div>

    <div class="progress-track">
      <div class="progress-fill" id="progress-bar"></div>
    </div>

    <div class="metrics-row">
      <span id="speed-val">0 KB/s</span>
      <span id="time-val">Calculating...</span>
    </div>
  </div>

  <script>
    const progressBar = document.getElementById('progress-bar');
    const statusTitle = document.getElementById('status-title');
    const statusSubtitle = document.getElementById('status-subtitle');
    const speedVal = document.getElementById('speed-val');
    const timeVal = document.getElementById('time-val');

    if (window.naptureAPI && window.naptureAPI.onUpdateDownloadProgress) {
      window.naptureAPI.onUpdateDownloadProgress((data) => {
        const { percent, speedBps, remainingSeconds, isExtracting } = data;

        if (isExtracting) {
          statusTitle.textContent = 'Installing update';
          statusSubtitle.textContent = 'Extracting and applying files...';
          progressBar.classList.add('indeterminate');
          speedVal.textContent = 'Finishing up';
          timeVal.textContent = 'Please wait...';
          return;
        }

        progressBar.classList.remove('indeterminate');
        progressBar.style.width = Math.min(100, Math.max(0, percent)) + '%';
        statusTitle.textContent = 'Napture updating';
        statusSubtitle.textContent = 'Downloading update package... ' + percent + '%';

        // Speed string
        let speedStr = '0 KB/s';
        if (speedBps > 1024 * 1024) {
          speedStr = (speedBps / (1024 * 1024)).toFixed(1) + ' MB/s';
        } else if (speedBps > 1024) {
          speedStr = (speedBps / 1024).toFixed(0) + ' KB/s';
        } else {
          speedStr = Math.round(speedBps) + ' B/s';
        }
        speedVal.textContent = speedStr;

        // Time string
        if (remainingSeconds === undefined || remainingSeconds < 0) {
          timeVal.textContent = 'Calculating...';
        } else if (remainingSeconds === 0) {
          timeVal.textContent = 'Download complete';
        } else if (remainingSeconds < 60) {
          timeVal.textContent = remainingSeconds + 's remaining';
        } else {
          const mins = Math.floor(remainingSeconds / 60);
          const secs = remainingSeconds % 60;
          timeVal.textContent = mins + 'm ' + secs + 's remaining';
        }
      });
    }

    if (window.naptureAPI && window.naptureAPI.onUpdateDownloadError) {
      window.naptureAPI.onUpdateDownloadError((data) => {
        statusTitle.textContent = 'Update failed';
        statusSubtitle.textContent = data.error || 'An error occurred during update.';
        progressBar.classList.remove('indeterminate');
        progressBar.style.background = 'var(--nb-danger)';
        progressBar.style.boxShadow = '0 0 12px var(--nb-danger-soft)';
        progressBar.style.width = '100%';
        speedVal.textContent = 'Error';
        timeVal.textContent = 'Closing shortly...';
      });
    }
  </script>
</body>
</html>
