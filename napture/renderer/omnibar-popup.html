<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: http:;">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../newebx/chrome/userChrome.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .napture-dropdown-menu,
    .omnibar-popup {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      border-radius: 14px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      box-sizing: border-box;
      background: rgba(23, 23, 32, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      transform-origin: top left;
      animation: menuFadeIn 0.12s cubic-bezier(0.16, 1, 0.3, 1);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .napture-dropdown-menu.animate,
    .omnibar-popup.animate {
      animation: menuFadeIn 0.12s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes menuFadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .menu-item {
      width: 100%;
      height: 28px;
      min-height: 28px;
      background: transparent;
      border: none;
      border-radius: 7px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: background-color 0.12s ease, color 0.12s ease;
      color: #c0caf5;
      text-decoration: none;
      box-sizing: border-box;
    }
    .menu-item:hover:not(.disabled) {
      background: rgba(255, 255, 255, 0.09);
      color: #ffffff;
    }
    .menu-item.disabled {
      opacity: 0.4;
      cursor: default;
      pointer-events: none;
    }
    .menu-item > span.item-title,
    .menu-item > span:first-child {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .menu-divider {
      height: 1px;
      margin: 3px 6px;
      background: rgba(255, 255, 255, 0.12);
      flex-shrink: 0;
    }
    .menu-meta {
      margin-left: auto;
      opacity: 0.45;
      font-size: 11px;
      font-weight: 400;
      flex-shrink: 0;
      padding-left: 8px;
    }
    body.light-theme .napture-dropdown-menu,
    body.light-theme .omnibar-popup {
      background: rgba(255, 255, 255, 0.94);
      border-color: rgba(0, 0, 0, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }
    body.light-theme .menu-item {
      color: #2e3440;
    }
    body.light-theme .menu-item:hover:not(.disabled) {
      background: rgba(0, 0, 0, 0.07);
      color: #0f141c;
    }
    body.light-theme .menu-divider {
      background: rgba(0, 0, 0, 0.12);
    }
  </style>
</head>
<body class="dark-theme">
  <div id="popup-container" class="napture-dropdown-menu omnibar-popup animate"></div>
  <script src="omnibar-popup.js"></script>
</body>
</html>
