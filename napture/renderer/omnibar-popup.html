<!DOCTYPE html>
<html lang="en" data-nb-surface="chrome">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: http:;">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../newebx/chrome/userChrome.css">
  <style>
    /* The design system (tokens + .nb-menu components) arrives through
       userChrome.css. Only overlay-specific geometry lives here. */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent !important;
    }
    /* The overlay view is sized to the menu, so the menu fills it. */
    #popup-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
    }
    #popup-container.animate {
      animation: nb-pop-in var(--nb-duration-fast) var(--nb-ease-out);
    }
  </style>
</head>
<body class="dark-theme">
  <div id="popup-container" class="nb-menu animate" role="menu"></div>
  <script src="omnibar-popup.js"></script>
</body>
</html>
