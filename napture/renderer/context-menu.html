<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:;">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .napture-dropdown-menu {
      width: 100%;
      height: 100%;
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border-radius: 14px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      box-sizing: border-box;
      background: rgba(23, 23, 32, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: menuFadeIn 0.12s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes menuFadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .menu-item {
      width: 100%;
      height: 28px;
      min-height: 28px;
      background: transparent;
      border: none;
      border-radius: 7px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s ease, color 0.12s ease;
    }
    .menu-item > span:first-child {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .menu-item.disabled {
      opacity: 0.4;
      cursor: default;
      pointer-events: none;
    }
    .menu-divider {
      height: 1px;
      margin: 3px 6px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="napture-dropdown-menu" id="menuContainer"></div>
  <script>
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (window.naptureAPI && window.naptureAPI.contextMenuAction) {
          window.naptureAPI.contextMenuAction(-1);
        }
      }
    });

    window.menuAction = function(index) {
      if (window.naptureAPI && window.naptureAPI.contextMenuAction) {
        window.naptureAPI.contextMenuAction(index);
      }
    };

    window.updateContent = function(html, bg, border, shadow, itemColor, itemHoverBg, itemHoverColor, isLight) {
       const container = document.getElementById('menuContainer');
       if (!container) return;
       container.innerHTML = html;
       container.style.background = bg;
       container.style.border = '1px solid ' + border;
       container.style.boxShadow = shadow;
       
       let styleTag = document.getElementById('dynamic-styles');
       if (!styleTag) {
          styleTag = document.createElement('style');
          styleTag.id = 'dynamic-styles';
          document.head.appendChild(styleTag);
       }
       styleTag.innerHTML = `
         .menu-item { color: ${itemColor}; }
         .menu-item:hover:not(.disabled) { background: ${itemHoverBg}; color: ${itemHoverColor}; }
         .menu-divider { background: ${border}; }
       `;
    };

    if (window.naptureAPI && window.naptureAPI.onUpdateMenu) {
      window.naptureAPI.onUpdateMenu((html, styles) => {
        window.updateContent(html, styles.cardBg, styles.cardBorder, styles.cardShadow, styles.itemColor, styles.itemHoverBg, styles.itemHoverColor, styles.isLight);
      });
    }
  </script>
</body>
</html>
