<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' ne: file:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: http: https: ne: file:; connect-src 'self' http: https: ws: wss:;">
  <title>Napture Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../newebx/chrome/userChrome.css">
</head>
<body>
  <div id="app">
    <!-- Top Header Bar -->
    <header id="header-bar" class="is-welcome-tab">
      <div class="header-left">
        <button id="brand-menu-btn" class="brand-menu-btn" title="Napture Menu" aria-label="Napture Menu">
          <div class="brand-badge" id="brand-badge">
            <img src="logo.png" class="brand-logo" alt="Napture Logo">
            <div class="brand-text-group">
              <span class="brand-title">Napture</span>
              <span class="brand-author">| By nebuff</span>
            </div>
          </div>
        </button>

        <!-- Main Napture Dropdown Menu -->
        <div id="napture-main-menu" class="napture-dropdown-menu hidden">
          <button class="menu-item" id="menu-item-new-tab" aria-label="New Tab">
            <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>New Tab</span>
          </button>

          <button class="menu-item" id="menu-item-history" aria-label="History">
            <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span>History</span>
          </button>

          <button class="menu-item" id="menu-item-downloads" aria-label="Downloads">
            <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>Downloads</span>
          </button>

          <div class="menu-divider"></div>

          <button class="menu-item" id="menu-item-settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span>Settings</span>
          </button>

          <button class="menu-item" id="menu-item-shortcuts" aria-label="Keyboard Shortcuts">
            <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect>
              <line x1="6" y1="8" x2="6.01" y2="8"></line>
              <line x1="10" y1="8" x2="10.01" y2="8"></line>
              <line x1="14" y1="8" x2="14.01" y2="8"></line>
              <line x1="18" y1="8" x2="18.01" y2="8"></line>
              <line x1="6" y1="12" x2="6.01" y2="12"></line>
              <line x1="10" y1="12" x2="10.01" y2="12"></line>
              <line x1="14" y1="12" x2="14.01" y2="12"></line>
              <line x1="18" y1="12" x2="18.01" y2="12"></line>
              <line x1="7" y1="16" x2="17" y2="16"></line>
            </svg>
            <span>Keyboard Shortcuts</span>
          </button>
          
          <div class="menu-divider"></div>

          <button class="menu-item" id="menu-item-about" aria-label="About Napture">
            <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
            <span>About Napture</span>
          </button>
        </div>
      </div>

      <div class="header-center">
        <!-- Navigation Buttons -->
        <div class="nav-buttons">
          <button id="back-btn" class="nav-btn" title="Go Back" aria-label="Go Back" disabled>
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <button id="forward-btn" class="nav-btn" title="Go Forward" aria-label="Go Forward" disabled>
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
          <button id="reload-btn" class="nav-btn" title="Reload Page" aria-label="Reload Page">
            <svg class="reload-icon" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
            </svg>
          </button>
          <button id="home-btn" class="nav-btn" title="Go Home" aria-label="Go Home">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </button>
        </div>

        <!-- Address Bar -->
        <div id="address-container">
          <div class="address-icon" id="security-badge">
            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </div>
          <div id="address-display" class="address-display"></div>
          <input type="text" id="address-input" class="hidden" placeholder="Search or type URL..." autocomplete="off">
          <div id="loading-indicator" class="loading-spinner hidden"></div>
          <div id="address-suggestions" class="address-suggestions-box hidden"></div>
          <div id="address-loading-bar" class="address-loading-bar"></div>
        </div>
      </div>

      <div class="header-right">
        <!-- Custom Frameless Window Controls -->
        <div class="window-controls">
          <button id="win-minimize" class="win-btn" title="Minimize" aria-label="Minimize">
            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none">
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <button id="win-maximize" class="win-btn" title="Maximize" aria-label="Maximize">
            <svg id="maximize-icon" viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            </svg>
            <svg id="restore-icon" class="hidden" viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none">
              <rect x="4" y="4" width="12" height="12" rx="1.5" ry="1.5" stroke="currentColor" stroke-width="2" fill="none"></rect>
              <path d="M8 4V2a1 1 0 0 1 1-1h12v12a1 1 0 0 1-1 1h-2" stroke="currentColor" stroke-width="2" fill="none"></path>
            </svg>
          </button>
          <button id="win-close" class="win-btn close" title="Close" aria-label="Close">
            <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Omnibar Firefox-Style Downloads Popup -->
    <div id="omnibar-downloads-popup" class="omnibar-popup hidden">
      <div class="omnibar-popup-content">
        <div id="omnibar-downloads-list" class="omnibar-downloads-list">
          <!-- Dynamic download items -->
        </div>
      </div>
      <div class="omnibar-popup-footer">
        <button id="omnibar-downloads-show-all" class="omnibar-popup-footer-btn" title="Show all downloads">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Show all downloads</span>
        </button>
      </div>
    </div>

    <!-- Omnibar Firefox-Style History Popup -->
    <div id="omnibar-history-popup" class="omnibar-popup hidden">
      <div class="omnibar-history-header">
        <div class="history-search-container">
          <svg class="history-search-icon" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="omnibar-history-search-input" placeholder="Search history..." autocomplete="off">
        </div>
      </div>
      <div class="omnibar-popup-content">
        <div id="omnibar-history-list" class="omnibar-history-list">
          <!-- Dynamic history items -->
        </div>
      </div>
      <div class="omnibar-popup-footer">
        <button id="omnibar-history-show-all" class="omnibar-popup-footer-btn" title="Open Full Screen History">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span>Show all history</span>
        </button>
      </div>
    </div>

    <!-- Main Workspace Area -->
    <div id="main-container">
      <!-- Vertical Sidebar -->
      <aside id="sidebar">
        <div class="sidebar-top">
          <!-- Pinned Site Shortcuts Area -->
          <div class="pinned-shortcuts" id="pinned-shortcuts">
            <div id="shortcuts-grid" class="shortcuts-grid">
              <!-- Pinned sites will be loaded here from storage / loaded dynamically -->
            </div>
          </div>

          <!-- Divider between pinned and bookmarks -->
          <div class="pinned-divider"></div>

          <!-- Bookmarks Section -->
          <!-- Bookmarks Area -->
          <div class="bookmarks-section is-empty">
            <div id="bookmarks-container">
            </div>
          </div>
          
          <div class="bookmarks-divider"></div>
          
          <div class="tabs-section">
            <div id="tabs-container">
              <!-- Dynamic tabs will be inserted here -->
            </div>
          </div>
        </div>

        <!-- Sidebar Bottom Area Container -->
        <div class="sidebar-bottom-container">
          <!-- Activity Cards (Notifications / Media Controls) -->
          <div class="activity-cards-container hidden" id="activity-cards-container">

            <!-- Default Browser Alert Card -->
            <div class="activity-card default-browser-card hidden" id="default-browser-card">
              <button class="close-activity-btn" id="default-browser-close-btn" title="Dismiss" aria-label="Dismiss">
                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
              <div class="update-card-header">
                Make Napture Default
              </div>
              <div class="update-card-body">
                <button class="update-btn" id="make-default-btn" aria-label="Set as default">Set as default</button>
              </div>
            </div>

            <!-- Update Alert Card -->
            <div class="activity-card update-card hidden" id="update-card">
              <button class="close-activity-btn" id="update-close-btn" title="Dismiss" aria-label="Dismiss">
                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
              <div class="update-card-header">
                New Version Available
              </div>
              <div class="update-card-body">
                <button class="update-btn" id="update-restart-btn" aria-label="Restart and Update">Restart and Update</button>
              </div>
            </div>

            <!-- Sync Alert Card -->
            <div class="activity-card sync-card hidden" id="sync-card">
              <button class="close-activity-btn" id="sync-close-btn" title="Dismiss" aria-label="Dismiss">
                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>
              <div class="update-card-header" id="sync-card-message">
                Sync Event
              </div>
            </div>

            <!-- Media Control Card -->
            <div class="activity-card media-card hidden" id="media-card">
              <button class="close-activity-btn" id="media-close-btn" title="Dismiss" aria-label="Dismiss">
                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              </button>

              <!-- Video Display Container -->
              <div class="media-video-container hidden" id="media-video-container">
                <img class="media-video-player" id="media-video-player" alt="Live Video" />
                <div class="media-video-overlay" id="media-video-overlay">
                  <button class="media-video-return-btn" id="media-video-return-btn" title="Back to tab" aria-label="Back to tab">
                    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                      <polyline points="15 3 21 3 21 9"></polyline>
                      <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                  </button>
                  <button class="media-video-minimize-btn" id="media-video-minimize-btn" title="Minimize video" aria-label="Minimize video">
                    <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                  </button>
                </div>
              </div>

              <!-- Media Bottom / Controls Row -->
              <div class="media-bottom-row" id="media-bottom-row">
                <div class="media-source-icon" id="media-source-icon">
                  <svg id="media-default-icon" viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 11.933a10.97 10.97 0 0 1 8-3.133"></path><path d="M8 15.5a8.973 8.973 0 0 1 7-2.5"></path><path d="M8 18.5a7.975 7.975 0 0 1 5-1.5"></path></svg>
                  <img id="media-artwork-img" class="media-artwork-img hidden" alt="Artwork" />
                  <button class="media-expand-video-btn hidden" id="media-expand-video-btn" title="Expand video" aria-label="Expand video">
                    <svg viewBox="0 0 24 24" width="10" height="10" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                      <polyline points="18 15 12 9 6 15"></polyline>
                    </svg>
                  </button>
                </div>
                <div class="media-controls" id="media-controls">
                  <button class="media-btn" id="media-btn-prev" title="Previous" aria-label="Previous">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                  </button>
                  <button class="media-btn" id="media-btn-play" title="Play/Pause" aria-label="Play/Pause">
                    <svg viewBox="0 0 24 24" id="media-icon-play"><path d="M8 5v14l11-7z"/></svg>
                  </button>
                  <button class="media-btn" id="media-btn-next" title="Next" aria-label="Next">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                  </button>
                  <div class="media-volume-wrapper" id="media-volume-wrapper">
                    <div class="media-volume-popup" id="media-volume-popup">
                      <div class="media-volume-track" id="media-volume-track">
                        <div class="media-volume-fill" id="media-volume-fill"></div>
                        <div class="media-volume-thumb" id="media-volume-thumb"></div>
                      </div>
                    </div>
                    <button class="media-btn" id="media-btn-volume" title="Volume / Mute (Scroll wheel to adjust volume)" aria-label="Volume / Mute">
                      <svg viewBox="0 0 24 24" id="media-icon-volume"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Recent Downloads Panel (now built-in) -->
          <div id="downloads-panel" class="downloads-panel hidden">
            <div class="downloads-header">
              <h3>Recent download history</h3>
            </div>
            <div id="downloads-list" class="downloads-list">
              <!-- Dynamic download items -->
            </div>
          </div>

          <!-- History Panel (now built-in) -->
          <div id="history-panel" class="history-panel hidden">
            <div class="history-header">
              <button id="btn-full-history" class="btn-full-history" title="Open Full Screen History" aria-label="Open Full Screen History">
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span>Full Screen History</span>
              </button>
              <div class="history-search-container">
                <svg class="history-search-icon" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="history-search-input" placeholder="Search history..." autocomplete="off">
              </div>
            </div>
            <div id="history-list" class="history-list">
              <!-- Dynamic history items -->
            </div>
          </div>

          <!-- Sidebar Bottom Action Bar (Customizable, Max 3 Buttons) -->
          <div class="sidebar-bottom" id="sidebar-bottom"></div>
        </div>
      </aside>

      <!-- Floating Viewport Container (Inset cutout card effect) -->
      <main id="viewport-container">
        <div id="viewport-placeholder">
          <div class="viewport-backdrop">
            <!-- Removed duplicate welcome search wrapper -->
          </div>
        </div>
      </main>

      <!-- Toolbar Customizer Workspace (Firefox UX with Napture Design) -->
      <div id="toolbar-customizer-workspace" class="toolbar-customizer-workspace hidden">
        <div class="customizer-workspace-scroll">
          <div class="customizer-workspace-header">
            <div class="customizer-workspace-header-text">
              <h2 class="customizer-workspace-title">Drag items into the toolbar, or click to add.</h2>
              <p class="customizer-workspace-subtitle">Drag to reorder slots on the top bar &bull; Drag down into the palette to remove &bull; Click "+ Add" to insert immediately.</p>
            </div>
          </div>

          <!-- Main Body: Clean Full-Width Palette Grid -->
          <div class="customizer-workspace-body">
            <div class="customizer-palette-section">
              <div id="customizer-palette-grid" class="customizer-palette-grid">
                <!-- Dynamically rendered draggable palette cards -->
              </div>
            </div>
          </div>
        </div>

        <!-- Add Custom Link Modal Dialog Popup -->
        <div id="customizer-dialog-overlay" class="customizer-dialog-overlay hidden">
          <div class="customizer-dialog-card" id="customizer-dialog-card">
            <div class="customizer-dialog-header">
              <div class="customizer-dialog-title">
                <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
                <span>Add Custom Link</span>
              </div>
              <button class="customizer-dialog-close" id="btn-customizer-close-dialog" aria-label="Close dialog">&times;</button>
            </div>
            <div class="customizer-dialog-body">
              <div class="customizer-dialog-field">
                <label for="customizer-link-title">Button Title (optional)</label>
                <input type="text" id="customizer-link-title" placeholder="e.g. GitHub, YouTube, Reddit" class="customizer-input" autocomplete="off" />
              </div>
              <div class="customizer-dialog-field">
                <label for="customizer-link-url">Website URL</label>
                <input type="text" id="customizer-link-url" placeholder="https://example.com" class="customizer-input" autocomplete="off" />
              </div>
            </div>
            <div class="customizer-dialog-footer">
              <button class="btn btn-secondary" id="btn-customizer-cancel-link">Cancel</button>
              <button class="btn btn-primary btn-save-dialog" id="btn-customizer-save-link">Add Link</button>
            </div>
          </div>
        </div>

        <!-- Sticky Footer Bar with Restore Defaults & Done -->
        <footer class="customizer-footer-bar">
          <div class="customizer-footer-left">
            <button class="btn btn-secondary" id="btn-customizer-restore-defaults">Restore Defaults</button>
          </div>
          <div class="customizer-footer-right">
            <button class="btn btn-primary btn-done" id="btn-customizer-done">Done</button>
          </div>
        </footer>
      </div>
    </div>
  </div>

  <!-- Mouse-following Drag Ghost Preview Card -->
  <div id="drag-ghost" class="drag-ghost hidden">
    <div class="drag-ghost-favicon"></div>
    <span class="drag-ghost-title"></span>
  </div>

  <!-- Universal Tab Context Menu -->
  <div id="tab-context-menu" class="napture-dropdown-menu hidden" style="position: fixed; z-index: 10000;">
    <!-- Items dynamically injected -->
  </div>

  <script src="bookmarks.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
